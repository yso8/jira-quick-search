name: Validate extension

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate manifest and references
        shell: pwsh
        run: ./scripts/validate-extension.ps1
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for file in *.js; do node --check "$file"; done
