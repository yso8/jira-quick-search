<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche Jira</title>
  <link href="vendor/tailwind.min.css" rel="stylesheet">
  <link href="vendor/flowbite.min.css" rel="stylesheet">
</head>
<body class="w-80 bg-gray-50 text-gray-900">
  <main class="p-4">
    <form id="quickSearchForm">
      <label for="quickSearchInput" class="sr-only">Recherche Jira</label>
      <div class="relative">
        <input id="quickSearchInput" type="text" autocomplete="off" autofocus
          class="block w-full rounded-lg border border-gray-300 bg-white p-3 pr-20 text-sm focus:border-blue-500 focus:ring-blue-500"
          placeholder="PROJ-123 ou facture octobre">
        <button type="submit" class="absolute right-1.5 top-1.5 rounded-lg bg-blue-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300">
          Go
        </button>
      </div>
    </form>
    <p id="quickSearchError" class="mt-3 hidden rounded-lg border border-red-100 bg-red-50 p-2 text-xs text-red-800" role="alert"></p>
    <p class="mt-3 text-center text-xs text-gray-500">Entrée pour rechercher · Échap pour fermer</p>
  </main>
  <script src="jira-api.js"></script>
  <script src="debug-logger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
