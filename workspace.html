<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace — Jira Quick Search</title>
  <link href="vendor/tailwind.min.css" rel="stylesheet"><link href="vendor/flowbite.min.css" rel="stylesheet">
  <link href="navbar.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900" data-page="workspace">
  <nav id="global-navbar"></nav>
  <main class="mx-auto max-w-6xl px-4 py-6">
    <header class="mb-4"><div class="flex flex-wrap items-start justify-between gap-3"><div><h1 class="text-2xl font-bold">Workspace</h1><p class="mt-1 text-sm text-gray-500">Retrouvez rapidement vos tickets et recherches importantes.</p></div><a href="search.html" class="rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-medium text-white hover:bg-blue-800 focus:ring-4 focus:ring-blue-300">Nouvelle recherche</a></div><p id="workspaceSummary" class="mt-3 text-sm text-gray-600" aria-live="polite"></p></header>
    <div class="grid gap-5 lg:grid-cols-[minmax(0,1fr)_20rem]">
      <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm"><div class="mb-3 flex items-center justify-between"><h2 class="font-semibold">Tickets</h2><a href="search.html" class="text-xs font-medium text-blue-700 hover:underline">Rechercher</a></div><div id="pinnedHeading" class="mb-2 text-xs font-semibold uppercase tracking-wide text-gray-500">Tickets épinglés</div><div id="pinnedIssues" class="space-y-2"></div><div id="recentHeading" aria-label="Tickets récents" class="mb-2 mt-5 hidden text-xs font-semibold uppercase tracking-wide text-gray-500">Récemment consultés</div><div id="recentIssues" class="space-y-2"></div></section>
      <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm"><div class="mb-3 flex items-center justify-between"><h2 class="font-semibold">Recherches sauvegardées</h2><a href="search.html" class="text-xs font-medium text-blue-700 hover:underline">Nouvelle</a></div><div id="savedSearches" class="space-y-2"></div></section>
    </div>
  </main>
  <script src="workspace-utils.js"></script><script src="navbar.js"></script><script src="workspace.js"></script>
</body>
</html>
